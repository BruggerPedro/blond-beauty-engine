run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    # Correctness — always on
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - typecheck

    # Security
    - gosec

    # Quality
    - bodyclose
    - durationcheck
    - exhaustive
    - misspell
    - nilerr
    - unconvert

linters-settings:
  gosec:
    excludes:
      - G104  # covered by errcheck; avoids double noise
    config:
      global:
        audit: true

  errcheck:
    check-type-assertions: true
    check-blank: true

  govet:
    enable-all: true
    disable:
      - fieldalignment  # struct layout optimization is out of scope here

  exhaustive:
    default-signifies-exhaustive: true

  misspell:
    locale: US

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
  exclude-use-default: false

  exclude-rules:
    # Test files may use unexported fields and less strict patterns.
    - path: _test\.go
      linters:
        - gosec
