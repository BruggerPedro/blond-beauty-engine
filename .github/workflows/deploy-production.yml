name: Deploy – Production

# Production deploys are MANUAL ONLY via workflow_dispatch.
# They NEVER happen automatically, even after a merge to main.
#
# Protection layers:
#   1. This workflow only runs on workflow_dispatch (explicit human trigger).
#   2. It validates that the trigger came from the main branch.
#   3. The GitHub Environment "production" must require manual approval
#      (Settings → Environments → production → Required reviewers).
#   4. The job references an explicit image tag/digest, preventing accidental
#      "latest" deployments.
#
# Before using this workflow:
#   1. Create the "production" environment in Settings → Environments.
#   2. Add at least one Required reviewer (typically the repo owner / team lead).
#   3. Set Deployment branches to "main" only.
#   4. Add production secrets: PROD_POSTGRES_URL, PROD_RABBIT_URL, PROD_REDIS_URL.
#   5. Optionally set a wait timer (e.g., 5 minutes) as a cancellation window.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: |
          Docker image tag to deploy. Use a short SHA tag from a successful
          staging build (e.g. sha-abc1234). Leave empty to use the :staging
          tag, but prefer explicit SHA tags for auditability.
        required: false
        default: "staging"
      reason:
        description: "Reason for this production deploy (for the audit log)"
        required: true

# Minimal top-level permissions.
permissions:
  contents: read

# Never allow two production deploys to run concurrently.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Safety checks ─────────────────────────────────────────────────────────
  pre-deploy-checks:
    name: Pre-deploy Safety Checks
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "ERROR: Production deploys are only allowed from the main branch."
            echo "       This run was triggered from: ${{ github.ref }}"
            echo "       Aborting."
            exit 1
          fi
          echo "Branch check passed: deploying from main."

      - name: Validate image tag input
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            echo "ERROR: image_tag input is empty. Provide a specific SHA tag."
            exit 1
          fi
          echo "Image tag to deploy: $TAG"

      - name: Log deploy intent
        run: |
          echo "### Production Deploy Requested" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Actor:** \`${{ github.actor }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image tag:** \`${{ inputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Reason:** ${{ inputs.reason }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Awaiting manual approval from required reviewers." >> $GITHUB_STEP_SUMMARY

  # ── Production deployment ─────────────────────────────────────────────────
  # This job is gated by the GitHub Environment "production" which requires
  # manual approval. The job will pause here until an authorized reviewer
  # approves the deployment in the GitHub Actions UI.
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: pre-deploy-checks
    environment:
      name: production
      # Update this URL once the production environment has a real address.
      url: https://blondbeauty.com.br
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image reference
        id: image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "Deploying image: $IMAGE"

      - name: Deploy to production
        env:
          IMAGE_REF: ${{ steps.image.outputs.image }}
          # Secrets are injected from the "production" GitHub Environment.
          # They are NEVER available in other environments or workflows.
          PROD_POSTGRES_URL: ${{ secrets.PROD_POSTGRES_URL }}
          PROD_RABBIT_URL: ${{ secrets.PROD_RABBIT_URL }}
          PROD_REDIS_URL: ${{ secrets.PROD_REDIS_URL }}
        run: |
          echo "Deploying image: $IMAGE_REF"
          echo ""
          echo "──────────────────────────────────────────────────────────────"
          echo "  PRODUCTION DEPLOYMENT PLACEHOLDER"
          echo "  Replace this step with your actual deployment command."
          echo ""
          echo "  IMPORTANT: Run database migrations BEFORE restarting the"
          echo "  service. Coordinate with the team to avoid downtime."
          echo ""
          echo "  Common options:"
          echo ""
          echo "  Railway:"
          echo "    railway up --service engine --environment production \\"
          echo "      --image \$IMAGE_REF"
          echo ""
          echo "  Fly.io:"
          echo "    flyctl deploy --image \$IMAGE_REF --app blond-engine-prod"
          echo ""
          echo "  AWS ECS:"
          echo "    aws ecs update-service \\"
          echo "      --cluster production \\"
          echo "      --service blond-engine \\"
          echo "      --force-new-deployment"
          echo ""
          echo "  Kubernetes (kubectl):"
          echo "    kubectl set image deployment/blond-engine \\"
          echo "      engine=\$IMAGE_REF \\"
          echo "      --namespace production"
          echo ""
          echo "  For zero-downtime: use a rolling update or blue-green strategy."
          echo "──────────────────────────────────────────────────────────────"

      - name: Production deploy summary
        if: always()
        run: |
          STATUS="${{ job.status }}"
          echo "### Production Deploy Result: $STATUS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Actor:** \`${{ github.actor }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image tag:** \`${{ inputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Reason:** ${{ inputs.reason }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** $STATUS" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
