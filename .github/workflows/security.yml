name: Security

# Deep security scans that run on pull requests, push to main, and on a weekly
# schedule. The schedule catches newly-disclosed vulnerabilities even when no
# code changes occur.
#
# CodeQL results are uploaded to GitHub Security → Code Scanning.
# Semgrep results are printed to the job log (SARIF optional with token).
# Gitleaks fails the run immediately if secrets are detected in history.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Every Monday at 03:00 UTC — catches newly-disclosed CVEs.
    - cron: "0 3 * * 1"

# Minimal top-level permissions; each job grants only what it needs.
permissions:
  contents: read

# Cancel in-progress security scans for the same PR.
# For pushes and scheduled runs, do not cancel so we always get full results.
concurrency:
  group: security-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.25.10"

jobs:
  # ── 1. CodeQL (SAST) ───────────────────────────────────────────────────────
  # Analyzes Go source code for security vulnerabilities and code quality
  # issues. Results appear in GitHub Security → Code Scanning tab.
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write  # Required to upload SARIF results.
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          # security-and-quality includes CWE queries on top of the default
          # security-extended suite. Catches more classes of bugs at the cost
          # of a small increase in false positives.
          queries: security-and-quality

      - name: Build for CodeQL
        # CodeQL needs to trace the Go build to understand the call graph.
        run: go build ./...

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:go"

  # ── 2. Secret scanning (Gitleaks) ─────────────────────────────────────────
  # Scans the full git history for accidentally committed secrets.
  # Fails immediately if any secret pattern is detected.
  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          # Full history is required for Gitleaks to scan all commits.
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is optional and only needed for Gitleaks Pro features.
          # Leave unset for the open-source ruleset.
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ── 3. SAST (Semgrep) ─────────────────────────────────────────────────────
  # Static analysis using Go-specific, OWASP, and secrets rulesets.
  # SEMGREP_APP_TOKEN is optional. Without it, Semgrep runs with OSS rules
  # and prints findings to the log without uploading to the Semgrep cloud.
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Do not fail the workflow if Semgrep is unavailable (e.g. rate limits).
    # Remove `continue-on-error` once the token is configured and results are
    # reviewed to avoid false-positive noise.
    continue-on-error: true
    container:
      image: semgrep/semgrep:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Semgrep
        run: |
          semgrep \
            --config=p/golang \
            --config=p/secrets \
            --config=p/owasp-top-ten \
            --error \
            --json-output=semgrep-results.json \
            . || EXIT_CODE=$?
          # Print summary regardless of exit code.
          if [ -f semgrep-results.json ]; then
            python3 -c "
          import json, sys
          d = json.load(open('semgrep-results.json'))
          findings = d.get('results', [])
          errors = d.get('errors', [])
          print(f'Semgrep findings: {len(findings)}, errors: {len(errors)}')
          for f in findings:
              print(f\"  [{f['extra']['severity']}] {f['check_id']} — {f['path']}:{f['start']['line']}\")
          " || true
          fi
          exit ${EXIT_CODE:-0}
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload Semgrep results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-results-${{ github.sha }}
          path: semgrep-results.json
          retention-days: 14

  # ── Summary gate ──────────────────────────────────────────────────────────
  # Branch protection should require "security / all-security-checks-pass".
  # Semgrep is excluded because it runs with continue-on-error above.
  all-security-checks-pass:
    name: All Security Checks Pass
    runs-on: ubuntu-latest
    if: always()
    needs: [codeql, gitleaks]
    steps:
      - name: Check required security jobs succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failed=$(echo "$NEEDS_JSON" | grep -c '"result": "failure"' || true)
          cancelled=$(echo "$NEEDS_JSON" | grep -c '"result": "cancelled"' || true)
          if [ "$failed" -gt 0 ] || [ "$cancelled" -gt 0 ]; then
            echo "One or more required security checks failed or were cancelled."
            exit 1
          fi
          echo "All required security checks passed."
